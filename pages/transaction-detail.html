<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transaction details</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">
    <main class="max-w-3xl mx-auto px-4 py-6">
        <a href="./history.html" class="text-sm font-semibold text-gray-900 hover:text-gray-600 transition">&lt; Back</a>

        <header class="mt-4 mb-6">
            <h1 class="text-2xl font-bold text-gray-900">Transaction details</h1>
            <p class="text-sm text-gray-500 mt-1">Official record of this wallet activity.</p>
        </header>

        <p id="transactionDetailError" class="text-red-500 text-sm mb-4 hidden"></p>

        <section class="bg-white border border-gray-200 rounded-2xl p-6 shadow-sm mb-5">
            <div class="flex items-start justify-between gap-4">
                <div>
                    <p class="text-sm text-gray-500 mb-2">Amount</p>
                    <p id="detailAmount" class="text-3xl font-bold font-mono text-gray-900">-</p>
                </div>

                <span id="detailStatus" class="inline-flex items-center rounded-full border border-gray-300 px-3 py-1 text-xs font-semibold uppercase text-gray-700">
                    -
                </span>
            </div>

            <div class="mt-5 flex items-center gap-2 text-sm text-gray-500">
                <span id="detailType">-</span>
                <span class="text-gray-300">&middot;</span>
                <span id="detailSource">-</span>
            </div>
        </section>

        <section class="bg-white border border-gray-200 rounded-2xl p-6 shadow-sm mb-5">
            <h2 class="text-sm font-semibold text-gray-900 mb-4">Balance movement</h2>

            <div class="flex flex-col md:flex-row md:items-center gap-3">
                <div class="flex-1 rounded-xl bg-gray-50 p-4">
                    <p class="text-xs text-gray-500 mb-1">Before</p>
                    <p id="detailBalanceBefore" class="text-lg font-bold font-mono text-gray-900">-</p>
                </div>

                <span class="hidden md:inline text-gray-300">&rarr;</span>
                <span class="md:hidden text-gray-300">&darr;</span>

                <div class="flex-1 rounded-xl bg-gray-50 p-4">
                    <p class="text-xs text-gray-500 mb-1">After</p>
                    <p id="detailBalanceAfter" class="text-lg font-bold font-mono text-gray-900">-</p>
                </div>
            </div>
        </section>

        <section id="transferDetailsSection" class="hidden bg-white border border-gray-200 rounded-2xl p-6 shadow-sm mb-5">
            <h2 class="text-sm font-semibold text-gray-900 mb-4">Transfer details</h2>
            
            <div class="text-sm">
                <div class="flex justify-between gap-4 py-3 border-b border-dashed border-gray-200">
                    <span id="detailCounterpartyLabel" class="text-gray-500">Counterparty</span>
                    <span id="detailCounterparty" class="font-semibold text-gray-900 text-right"></span>
                </div>
                
                <div class="flex justify-between gap-4 py-3 border-b border-dashed border-gray-200">
                    <span id="detailCounterpartyPhoneLabel" class="text-gray-500">Counterparty phone</span>
                    <span id="detailCounterpartyPhone" class="font-semibold text-gray-900 text-right"></span>
                </div>

                <div id="detailRecipientReceivedRow" class="flex justify-between gap-4 py-3 border-b border-dashed border-gray-200">
                    <span class="text-gray-500">Recipient received</span>
                    <span id="detailRecipientReceived" class="font-semibold text-gray-900 text-right"></span>
                </div>
                
                <div id="detailTransferFeeRow" class="flex justify-between gap-4 py-3 border-b border-dashed border-gray-200">
                    <span class="text-gray-500">Fee</span>
                    <span id="detailTransferFee" class="font-semibold text-gray-900 text-right"></span>
                </div>
                
                <div id="detailTransferRateRow" class="hidden flex justify-between gap-4 py-3 border-b border-dashed border-gray-200">
                    <span class="text-gray-500">Rate</span>
                    <span id="detailTransferRate" class="font-semibold text-gray-900 text-right"></span>
                </div>
                
                <div class="flex justify-between gap-4 py-3">
                    <span class="text-gray-500">Transfer reference</span>
                    <span id="detailTransferReference" class="font-mono font-semibold text-gray-900 text-right"></span>
                </div>
            </div>
        </section>

        <section class="bg-white border border-gray-200 rounded-2xl p-6 shadow-sm">
            <h2 class="text-sm font-semibold text-gray-900 mb-4">Transaction record</h2>

            <div class="text-sm">
                <div class="flex justify-between gap-4 py-3 border-b border-dashed border-gray-200">
                    <span class="text-gray-500">Transaction reference</span>
                    <span id="detailReference" class="font-mono font-semibold text-gray-900 text-right"></span>
                </div>

                <div class="flex justify-between gap-4 py-3 border-b border-dashed border-gray-200">
                    <span class="text-gray-500">Description</span>
                    <span id="detailDescription" class="font-semibold text-gray-900 text-right"></span>
                </div>

                <div class="flex justify-between gap-4 py-3">
                    <span class="text-gray-500">Date</span>
                    <span id="detailDate" class="font-semibold text-gray-900 text-right"></span>
                </div>

            </div>

            <button id="downloadBtn" class="w-full border-2 border-gray-900 text-gray-900 py-3 rounded-xl font-semibold hover:bg-gray-900 hover:text-white transition mt-6">
                Download receipt
            </button>
        </section>
    </main>

    <script src="../js/transaction-detail.js" type="module" defer></script>
</body>
</html>
