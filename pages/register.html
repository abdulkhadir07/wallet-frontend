<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Register - Linkcore</title>
        <script src="https://cdn.tailwindcss.com"></script>
    </head>
    <body class="bg-[#2D0A45] flex min-h-screen items-center justify-center">
        <div class="bg-white rounded-2xl p-8 w-full max-w-md shadow-lg">

            <!-- Login / register -->
            <div id="step-0" class="flex flex-col items-center gap-6">
                <h1 class="text-4xl font-bold text-[#2D0A45]">Linkcore</h1>
                <p class="text-gray-500 text-sm"> Your safe haven</p>
                <button id="login-btn" class="w-full border-2 border-[#2D0A45] text-[#2D0A45] py-3 rounded-xl font-semibold hover:bg-[#2D0A45] hover:text-white transition">Login</button>
                <button id="create-account-btn" class="w-full bg-[#A47E1B] text-white py-3 rounded-xl font-semibold hover:opacity-90 transition">Create Account</button>
            </div>

           <!-- Email -->
            <div id="step-1" class="hidden">
                <h1 class="text-2xl font-bold text-[#2D0A45] mb-6">What's your email</h1>
                <input id="email" placeholder="Enter your email" type="email" class="w-full border border-gray-300 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-[#2D0A45] mb-4"/>
                <button id="next-1" class="w-full bg-[#2D0A45] text-white py-3 rounded-xl font-semibold hover:opacity-90 transition">Next</button>
                <button id="back-to-step-0" class="text-sm text-gray-400 mt-2 hover:text-[#2D0A45] transition">Back</button>
            </div>

            <!-- first&lastname, DOB -->
            <div id="step-2" class="hidden">
                <h1 class="text-2xl font-bold text-[#2D0A45] mb-6">Tell us about yourself</h1>
                <input id="first-nameInput" type="text" placeholder="your first name" class="w-full border border-gray-300 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-[#2D0A45] mb-4"/>
                <input id="last-nameInput" type="text" placeholder="your last name" class="w-full border border-gray-300 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-[#2D0A45] mb-4"/>
                <input id="DOBInput" type="date" placeholder="your date of birth" class="w-full border border-gray-300 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-[#2D0A45] mb-4"/>
                <button id="next-2" class="w-full bg-[#2D0A45] text-white py-3 rounded-xl font-semibold hover:opacity-90 transition">Next</button>
                <button id="back-to-step-1" class="text-sm text-gray-400 mt-2 hover:text-[#2D0A45] transition">Back</button>
            </div>

            <!-- country, phoneNumber -->
            <div id="step-3" class="hidden">
                <h1 class="text-2xl font-bold text-[#2D0A45] mb-6">Where are you registering from</h1>
                <select id="country" class="w-full border border-gray-300 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-[#2D0A45] mb-4">
                    <option value="">Select your country of residence</option>
                    <option value="USA">United States</option>
                    <option value="CANADA">Canada</option>
                    <option value="UK">United Kingdom</option>
                    <option value="GERMANY">Germany</option>
                    <option value="FRANCE">France</option>
                    <option value="ITALY">Italy</option>
                    <option value="SPAIN">Spain</option>
                    <option value="GAMBIA">The Gambia</option>
                    <option value="SENEGAL">Senegal</option>
                    <option value="NIGERIA">Nigeria</option>
                    <option value="GHANA">Ghana</option>
                    <option value="CHINA">China</option>
                    <option value="INDIA">India</option>
                    <option value="JAPAN">Japan</option>
                    <option value="SWITZERLAND">Switzerland</option>
                    <option value="SOUTH_KOREA">South Korea</option>
                    <option value="MOROCCO">Morocco</option>
                    <option value="SOUTH_AFRICA">South Africa</option>
                    <option value="ETHIOPIA">Ethiopia</option>
                    <option value="KENYA">Kenya</option>
                    <option value="MALI">Mali</option>
                    <option value="CONGO">Congo</option>
                    <option value="CAMEROON">Cameroon</option>
                    <option value="IVORY_COAST">Ivory Coast</option>
                    <option value="BURKINA_FASO">Burkina Faso</option>
                </select>
                <input id="phoneNumberInput" type="tel" placeholder="your phone number" class="w-full border border-gray-300 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-[#2D0A45] mb-4"/>
                <button id="next-3" class="w-full bg-[#2D0A45] text-white py-3 rounded-xl font-semibold hover:opacity-90 transition">Next</button>
                <button id="back-to-step-2" class="text-sm text-gray-400 mt-2 hover:text-[#2D0A45] transition">Back</button>
            </div>

            <!-- password -->
            <div id="step-4" class="hidden">
                <h1 class="text-2xl font-bold text-[#2D0A45] mb-6">Create a password</h1>
                <input id="passwordInput" type="password" placeholder="no less than 8 characters" class="w-full border border-gray-300 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-[#2D0A45] mb-4"/>
                <button id="createAccountBtn" class="w-full bg-[#2D0A45] text-white py-3 rounded-xl font-semibold hover:opacity-90 transition">Create</button>
                <button id="back-to-step-3" class="text-sm text-gray-400 mt-2 hover:text-[#2D0A45] transition">Back</button>
            </div>


        </div>


        <script src="register.js" defer></script>
    </body>

</html>
